# Builds the extension package and publishes it to extensions.blender.org.
#
# extensions.blender.org does not track this repository: a version only goes
# live once its .zip is uploaded. Publishing a GitHub Release does that here.
#
# Setup: store an upload token from
# https://extensions.blender.org/settings/tokens/ as the repository secret
# BLENDER_EXTENSIONS_TOKEN (Settings > Secrets and variables > Actions).

name: Publish extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to extensions.blender.org (off = build and validate only)"
        type: boolean
        default: false
      release_tag:
        description: "Existing release tag to build and take the release notes from (e.g. v1.1.1). Leave empty to use the default branch."
        type: string
        default: ""

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.1.2"
  EXTENSION_ID: flatcut
  # The release this run belongs to, for a release event or a dispatched retry
  TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          series="${BLENDER_VERSION%.*}"
          url="https://download.blender.org/release/Blender${series}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          echo "Downloading $url"
          mkdir -p ~/blender
          curl -fsSL "$url" | tar -xJ -C ~/blender --strip-components=1

      - name: Check the manifest version against the tag
        if: env.TAG != ''
        run: |
          manifest_version=$(grep -m1 '^version = ' blender_manifest.toml | cut -d'"' -f2)
          tag_version="${TAG#v}"
          echo "manifest: $manifest_version | tag: $tag_version"
          if [ "$manifest_version" != "$tag_version" ]; then
            echo "::error::blender_manifest.toml is at $manifest_version but the tag is $tag_version. Bump the manifest and re-tag."
            exit 1
          fi

      - name: Validate
        run: ~/blender/blender --command extension validate .

      - name: Build
        id: build
        run: |
          mkdir -p dist
          ~/blender/blender --command extension build --source-dir . --output-dir dist
          package=$(ls dist/*.zip | head -1)
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "Built $package"
          unzip -l "$package"

      - name: Upload the package as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXTENSION_ID }}-package
          path: ${{ steps.build.outputs.package }}

      - name: Attach the package to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.build.outputs.package }}" --clobber

      # A tag created before this workflow existed does not carry its scripts,
      # so the trimming tool always comes from the default branch
      - name: Check out the release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .tooling
          sparse-checkout: .github/scripts

      - name: Publish to extensions.blender.org
        if: github.event_name == 'release' || inputs.publish
        env:
          TOKEN: ${{ secrets.BLENDER_EXTENSIONS_TOKEN }}
          PACKAGE: ${{ steps.build.outputs.package }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret BLENDER_EXTENSIONS_TOKEN is not set (Settings > Secrets and variables > Actions). Create a token at https://extensions.blender.org/settings/tokens/"
            exit 1
          fi

          # Take the notes from the release, so a dispatched retry of a failed
          # upload reuses them instead of falling back to a bare commit line
          if [ -n "$TAG" ]; then
            RELEASE_NOTES=$(gh release view "$TAG" --json body --jq .body)
            RELEASE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            export RELEASE_NOTES RELEASE_URL
          fi

          # The platform caps release notes at 1024 characters
          notes=$(python3 .tooling/.github/scripts/release_notes.py)
          echo "Release notes: ${#notes} characters"

          status=$(curl -sS -X POST \
            "https://extensions.blender.org/api/v1/extensions/${EXTENSION_ID}/versions/upload/" \
            -H "Authorization: bearer $TOKEN" \
            -F "version_file=@${PACKAGE}" \
            -F "release_notes=${notes}" \
            -o response.json -w '%{http_code}')

          echo "HTTP $status"
          cat response.json
          echo

          case "$status" in
            2*) echo "Uploaded. New versions may sit in the moderation queue before going live." ;;
            *)  echo "::error::Upload failed with HTTP $status"; exit 1 ;;
          esac
